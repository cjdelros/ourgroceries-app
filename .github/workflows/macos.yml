name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test GroceriesCore package
        working-directory: Packages/GroceriesCore
        run: swift test --parallel
      - name: Build app without signing
        run: >-
          xcodebuild
          -project OurGroceriesMenuBar.xcodeproj
          -scheme OurGroceriesMenuBar
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Run app unit tests
        run: >-
          xcodebuild
          -project OurGroceriesMenuBar.xcodeproj
          -scheme OurGroceriesMenuBar
          -configuration Debug
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          -only-testing:OurGroceriesAppTests
          test
